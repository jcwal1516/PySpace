[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspace-analysis"
version = "0.1.0"
description = "Python implementation of Spatial Patterning Analysis of Cellular Ensembles"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "PySpace contributors" }]
keywords = ["spatial analysis", "multiplex imaging", "mutual information", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pillow>=10",
  "plotly>=5.20",
  "psutil>=5.9",
  "pyarrow>=15",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "tifffile>=2023.0",
]

[project.optional-dependencies]
community = [
  "igraph>=0.11",
  "infomap>=2.9",
  "leidenalg>=0.10.2",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pip-licenses>=5",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.8",
  "twine>=6",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]

[project.scripts]
pyspace = "pyspace.cli:main"

[project.urls]
Homepage = "https://github.com/jcwal1516/PySpace"
Repository = "https://github.com/jcwal1516/PySpace"
Issues = "https://github.com/jcwal1516/PySpace/issues"
Upstream = "https://github.com/eschrom/SPACE"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyspace = ["py.typed", "data/**/*.csv", "data/**/*.json", "data/**/COMMIT", "data/**/NAMESPACE"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["live_r: requires R and a pristine clone of the pinned upstream SPACE commit"]
filterwarnings = [
  "error",
  "ignore:Plotly not available.*:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["pyspace"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]
extend-exclude = ["site", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "C4", "C90", "SIM", "PLR", "PERF", "NPY"]
ignore = ["B008", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 8
max-statements = 75

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "NPY002"] # Legacy RNG calls verify production code does not mutate global state.
"src/pyspace/core/r_measure_cismi.py" = ["C901", "PLR0912", "PLR0915"]
"src/pyspace/core/r_measure_transmi.py" = ["C901", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.11"
files = ["src/pyspace", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
