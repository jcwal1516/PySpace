name: Community backends

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,community]"
      - run: python -m pytest -q tests/test_networks.py
        env:
          PYSPACE_REQUIRE_COMMUNITY: "1"
