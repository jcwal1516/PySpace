name: Community backends

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,community]"
      - run: python -m pytest -q tests/test_networks.py
        env:
          PYSPACE_REQUIRE_COMMUNITY: "1"
