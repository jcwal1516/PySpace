name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-and-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_public_tree.py
      - run: python scripts/write_data_manifest.py --check
      - run: python scripts/write_dependency_inventory.py --check
      - run: python -m pip_audit
      - run: python -m build
      - run: python scripts/inspect_distribution.py dist/*
      - run: python -m piplicenses --format=markdown --with-urls
      - run: python scripts/write_artifact_manifest.py --check
